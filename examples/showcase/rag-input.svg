<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
<title>RAG：这些词怎样连起来？ / 专业输入 · 官方资料提炼</title>
<desc>文字演示图卡；专业输入与真实模型输出分别标注；不是聊天窗口截图。</desc>
<rect width="1080" height="1440" fill="#f3f6f4"/>
<text x="64" y="76" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="28" font-weight="bold" fill="#17675e">explain-clearly</text>
<text x="64" y="150" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="50" font-weight="bold" fill="#18343b">RAG：这些词怎样连起来？</text>
<text x="64" y="211" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="31" font-weight="bold" fill="#566773">专业输入 · 官方资料提炼</text>
<rect x="64" y="260" width="952" height="517.0" rx="22" fill="#ffffff" stroke="#cfdbd5"/>
<rect x="64" y="288" width="5" height="461.0" fill="#566773"/>
<text x="94" y="312" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="36" font-weight="normal" fill="#19343c">某个 RAG 方案将问题转换为 embedding，执行 BM25</text>
<text x="94" y="363.12" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="36" font-weight="normal" fill="#19343c">全文检索和向量检索，再用 RRF 合并结果，并由</text>
<text x="94" y="414.24" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="36" font-weight="normal" fill="#19343c">semantic ranker 做 rerank。最终选出的资料片段进入生</text>
<text x="94" y="465.36" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="36" font-weight="normal" fill="#19343c">成模型的上下文，用于组织回答。</text>
<text x="94" y="536.48" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="36" font-weight="normal" fill="#19343c">普通提问：</text>
<text x="94" y="587.6" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="36" font-weight="normal" fill="#19343c">这段方案说明在做什么？这些词分别负责哪一步，为什</text>
<text x="94" y="638.72" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="36" font-weight="normal" fill="#19343c">么要组合使用？</text>
<text x="94" y="689.84" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="36" font-weight="normal" fill="#19343c">请只用文字回答。</text>
<line x1="64" y1="1288" x2="1016" y2="1288" stroke="#ccdad2"/>
<text x="64" y="1323" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="23" font-weight="normal" fill="#53676b">这是专业输入，不是未加载 Skill 的回复。</text>
<text x="64" y="1357" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="23" font-weight="normal" fill="#53676b">执行时另提供冻结来源摘记；完整记录见文字示例。</text>
</svg>
