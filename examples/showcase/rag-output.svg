<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
<title>RAG：先把每一步讲清楚 / 实际文字答复 · 原句摘录</title>
<desc>文字演示图卡；专业输入与真实模型输出分别标注；不是聊天窗口截图。</desc>
<rect width="1080" height="1440" fill="#f3f6f4"/>
<text x="64" y="76" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="28" font-weight="bold" fill="#17675e">explain-clearly</text>
<text x="64" y="150" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="50" font-weight="bold" fill="#18343b">RAG：先把每一步讲清楚</text>
<text x="64" y="211" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="31" font-weight="bold" fill="#17675e">实际文字答复 · 原句摘录</text>
<rect x="64" y="260" width="952" height="983.2" rx="22" fill="#ffffff" stroke="#cfdbd5"/>
<rect x="64" y="288" width="5" height="927.2" fill="#17675e"/>
<text x="94" y="312" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="35" font-weight="normal" fill="#19343c">这段话描述的是：先用几种方式从资料库里找出可能相关</text>
<text x="94" y="361.7" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="35" font-weight="normal" fill="#19343c">的内容，再把筛选后的片段交给生成模型，让它结合这些</text>
<text x="94" y="411.4" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="35" font-weight="normal" fill="#19343c">资料回答问题。</text>
<text x="94" y="481.09999999999997" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="35" font-weight="normal" fill="#19343c">Embedding（向量表示）：把问题转换成一串数字，供系</text>
<text x="94" y="530.8" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="35" font-weight="normal" fill="#19343c">统比较问题和资料在含义上是否接近。</text>
<text x="94" y="600.5" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="35" font-weight="normal" fill="#19343c">BM25 全文检索：根据问题中的词，在资料文字里查找并</text>
<text x="94" y="650.2" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="35" font-weight="normal" fill="#19343c">排列相关内容。</text>
<text x="94" y="719.9000000000001" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="35" font-weight="normal" fill="#19343c">RRF 合并：把 BM25 和向量检索各自排出的结果合成一份</text>
<text x="94" y="769.6000000000001" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="35" font-weight="normal" fill="#19343c">候选清单。它主要参考每条结果在各自清单里的名次，不</text>
<text x="94" y="819.3000000000002" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="35" font-weight="normal" fill="#19343c">是把两种检索的原始分数直接相加。</text>
<text x="94" y="889.0000000000002" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="35" font-weight="normal" fill="#19343c">Semantic ranker（语义排序器）：再看候选片段的文字与</text>
<text x="94" y="938.7000000000003" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="35" font-weight="normal" fill="#19343c">问题有多相关，调整它们的顺序。这里的 rerank 就是“重</text>
<text x="94" y="988.4000000000003" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="35" font-weight="normal" fill="#19343c">新排序”；它不会替生成模型写答案，也不是事实核验器。</text>
<text x="94" y="1058.1000000000004" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="35" font-weight="normal" fill="#19343c">这样做是为了增加找到相关资料的机会并改善候选顺序，</text>
<text x="94" y="1107.8000000000004" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="35" font-weight="normal" fill="#19343c">但不能保证检索到的内容正确、完整，也不能保证最终回</text>
<text x="94" y="1157.5000000000005" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="35" font-weight="normal" fill="#19343c">答一定正确。</text>
<line x1="64" y1="1288" x2="1016" y2="1288" stroke="#ccdad2"/>
<text x="64" y="1323" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="23" font-weight="normal" fill="#53676b">明确读取 Skill 后生成；仅调整排版、摘录原句。</text>
<text x="64" y="1357" font-family="Arial Unicode MS,Heiti TC,sans-serif" font-size="23" font-weight="normal" fill="#53676b">本轮基线也较清楚；完整同题对照见文字示例。</text>
</svg>
